[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-cultural-alignment-africa"
version = "0.1.0"
description = "Multi-agent evaluation of text-image cultural alignment in African contexts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Microsoft Corporation"},
]
dependencies = [
  "openai>=1.60,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
include = ["config*", "src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "StoryGen/tests"]
